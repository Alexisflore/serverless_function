name: Process Daily Data UK - Hourly Sync

on:
  schedule:
    # Minute 40 : décalé de US (0) et JP (20) pour éviter les exécutions simultanées
    - cron: '40 * * * *'
  workflow_dispatch:

concurrency:
  group: daily-sync-uk
  cancel-in-progress: false

jobs:
  process-daily-data-uk:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Pipenv
        run: |
          echo "📦 Installation de Pipenv..."
          pip install --upgrade pip
          pip install pipenv

      - name: Install dependencies
        run: |
          echo "📦 Installation des dépendances depuis Pipfile..."
          pipenv install --deploy

      - name: Process Daily Data (UK)
        env:
          # Shopify API - app Shopify CLI du store UK (token obtenu au runtime via client credentials)
          SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN_UK }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID_UK }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET_UK }}
          SHOPIFY_API_VERSION: ${{ secrets.SHOPIFY_API_VERSION }}
          # Multi-country
          COMMERCIAL_ORGANISATION: 'UK'
          # Supabase (meme base de donnees que US)
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_TOKEN }}
          # Database
          SUPABASE_USER: ${{ secrets.SUPABASE_USER }}
          SUPABASE_PASSWORD: ${{ secrets.SUPABASE_PASSWORD }}
          SUPABASE_HOST: ${{ secrets.SUPABASE_HOST }}
          SUPABASE_PORT: ${{ secrets.SUPABASE_PORT }}
          SUPABASE_DB_NAME: ${{ secrets.SUPABASE_DB_NAME }}
          # Security
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          echo "🚀 Démarrage du traitement des données (UK)..."
          pipenv run python run_daily_sync.py

      - name: Notify on failure
        if: failure()
        run: |
          echo "⚠️ Le cron job UK a échoué. Vérifiez les logs ci-dessus."
