name: Process Daily Data - Hourly Sync

on:
  schedule:
    # Exécute toutes les heures à la minute 0
    - cron: '0 * * * *'
  # Permet également le déclenchement manuel depuis l'interface GitHub
  workflow_dispatch:

concurrency:
  group: daily-sync-us
  cancel-in-progress: false

jobs:
  process-daily-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Pipenv
        run: |
          echo "📦 Installation de Pipenv..."
          pip install --upgrade pip
          pip install pipenv

      - name: Install dependencies
        run: |
          echo "📦 Installation des dépendances depuis Pipfile..."
          pipenv install --deploy

      - name: Process Daily Data (US)
        env:
          # Shopify API
          SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
          SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
          SHOPIFY_API_VERSION: ${{ secrets.SHOPIFY_API_VERSION }}
          # Multi-country
          COMMERCIAL_ORGANISATION: 'US'
          # Supabase (pour database.py qui utilise supabase client)
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_TOKEN }}
          # Database - variables séparées (fallback de DATABASE_URL)
          SUPABASE_USER: ${{ secrets.SUPABASE_USER }}
          SUPABASE_PASSWORD: ${{ secrets.SUPABASE_PASSWORD }}
          SUPABASE_HOST: ${{ secrets.SUPABASE_HOST }}
          SUPABASE_PORT: ${{ secrets.SUPABASE_PORT }}
          SUPABASE_DB_NAME: ${{ secrets.SUPABASE_DB_NAME }}
          # Security
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          echo "🚀 Démarrage du traitement des données..."
          pipenv run python run_daily_sync.py

      - name: Notify on failure
        if: failure()
        run: |
          echo "⚠️ Le cron job a échoué. Vérifiez les logs ci-dessus."